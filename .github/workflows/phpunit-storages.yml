# The FileListener filters the cache events by the layout of the storage they come from, which
# the groupfolders and files_external apps define. This runs the tests against the real apps, so
# that a change in their paths, storage ids or events is noticed here.

name: PHPUnit storages

on:
  pull_request:
  schedule:
    # the apps change independently of this one
    - cron: '0 5 * * 1'

permissions:
  contents: read

env:
  APP_NAME: context_chat

concurrency:
  group: phpunit-storages-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest-low
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src }}

    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/phpunit-storages.yml'
              - 'lib/**'
              - 'tests/integration/FileListenerStoragesTest.php'
              - 'composer.json'
              - 'composer.lock'

  phpunit-storages:
    runs-on: ubuntu-latest

    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.src != 'false'

    strategy:
      fail-fast: false
      matrix:
        php-versions: [ '8.3' ]
        # the groupfolders app has a branch for each of these
        server-versions: [ 'stable33', 'stable34', 'stable35', 'master' ]

    name: Storages PHP ${{ matrix.php-versions }} Nextcloud ${{ matrix.server-versions }}

    steps:
      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: apps/${{ env.APP_NAME }}

      - name: Checkout groupfolders
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: nextcloud/groupfolders
          ref: ${{ matrix.server-versions }}
          path: apps/groupfolders

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-versions }}
          # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development
          # Temporary workaround for missing pcntl_* in PHP 8.3
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove nextcloud/ocp
        working-directory: apps/${{ env.APP_NAME }}
        run: composer remove nextcloud/ocp --dev --no-scripts

      - name: Install composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: apps/${{ env.APP_NAME }}

      - name: Set up Nextcloud
        run: |
          mkdir data
          ./occ maintenance:install --verbose --database=sqlite --database-name=nextcloud --admin-user admin --admin-pass admin
          ./occ app:enable --force ${{ env.APP_NAME }} groupfolders files_external files_versions files_trashbin

      - name: PHPUnit
        working-directory: apps/${{ env.APP_NAME }}
        env:
          CONTEXT_CHAT_REQUIRE_STORAGE_APPS: '1'
          TEST_DONT_LOAD_APPS: ''
        run: vendor/bin/phpunit --configuration tests/phpunit.xml --no-coverage tests/integration/FileListenerStoragesTest.php

      - name: Print logs
        if: always()
        run: cat data/nextcloud.log

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest-low
    needs: [changes, phpunit-storages]

    if: always()

    name: phpunit-storages-summary

    steps:
      - name: Summary status
        run: if ${{ needs.changes.outputs.src != 'false' && needs.phpunit-storages.result != 'success' && needs.phpunit-storages.result != 'skipped' }}; then exit 1; fi
